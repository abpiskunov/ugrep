[package]
name = "src_core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[features]
# Seam tap build variant (see rust/src_core/cpp2rust_tap.hpp).
tap = []

[dependencies]
cxx = "1"
# The Rust Zthread (src/ugrep.cpp decompression thread) drives the zstream core of src_leaves
# (ffi/zstream.rs, zstream_core.rs). One direction only: src_leaves depends on no other workspace crate.
src_leaves = { path = "../src_leaves", default-features = false }

[build-dependencies]
cxx-build = "1"

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
