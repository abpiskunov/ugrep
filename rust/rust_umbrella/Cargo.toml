[package]
name = "rust_umbrella"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "umbrella.rs"
crate-type = ["staticlib"]

[features]
# Seam tap build variant: records calls on both sides in one trace schema.
tap = ["src_leaves/tap"]

[dependencies]
src_leaves = { path = "../src_leaves" }

