notes:
  - 'BLOCKED, nothing ported. Scope: src/ugrep.cpp ~228-757 (flag_* globals, Static members, encoding_table/type_table, sigint, set_this_thread_affinity_and_priority, open_pager/close_pager, fopen_smart).'
  - 'Flag ownership decision (rust/src_core/SEAM.md): C++ owns every flag_* global and Static::* member; Rust never holds them. These definitions therefore must stay C++ (they are data read inline by Grep/Output/TUI), so there is no Rust body to write for them.'
  - 'No seam exists for the functions that could move: rust/src_core/src/signatures.rs has no open_pager, close_pager, fopen_smart, sigint or set_this_thread_affinity_and_priority, and src/core_tap.hpp does not tap them.'
  - 'No recorded cases: migration/corpus/src_core/seam/all.trace.jsonl contains only cnf_*, stats_report, ugrep, terminal, set_terminal_hyperlink (and src_leaves.glob_match). The catalog excludes sigint/cancel as non-deterministic. The unit gate (seam-replay, cases >= 1) cannot pass for this unit.'
  - 'Rust cannot do pager/fopen_smart without touching Static::output (FILE*, C++ owned, popen/pclose) and flag_pager (const char* written by the option parser); signal handlers and thread affinity are OS side effects with no observable result to replay.'
  - 'Follow-up needed: a Prepare seam step (facade + signatures for open_pager/close_pager/fopen_smart/affinity, tap) and a Behavior step (cases for --pager with non-tty, fopen_smart on config files, affinity) or a Plan amendment dropping this range from the Rust port (keep as retained C++).'
