notes:
  - 'Scope: Output buffer (block storage, flush, hold/ordered buffers, line buffering, --width truncation), Dump::hex with its state, Output::Tree path/depth/glyphs. src/output.cpp is deleted; its facade members are inline in src/output_rust.hpp. No output.obj is linked.'
  - 'Hot path: C++ Output embeds a repr(C) Regs {cur,end,mode} that Rust fills; chr/str/nl write straight into the Rust-owned block and call the bridge only when the block is full, for try_flush after nl in --line-buffered mode, and per hex/tree request. Flush uses CRT fwrite/fflush on the same FILE* (static CRT on both sides).'
  - 'Known differences: the Rust hex-dump pstar starts false where C++ left it uninitialized; flag_hex_columns is read from Rust settings (clamped 1..64).'
