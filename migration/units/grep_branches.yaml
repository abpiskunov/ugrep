notes:
  - 'S4c-4 port: Rust bodies of branch::only_matching and only_matching_context (-o without and with -ABC) in rust/src_core/src/search.rs. The C++ bodies of Grep::search_only_matching and search_only_matching_context in src/ugrep.cpp are forwarders to the bridge, as search_format. No build switch, no tap. The OnlyMatchingContextGrepHandler (save_restline on shift) stays in C++, registered through set_shift_handler(ONLY_MATCHING_CONTEXT); the restline members stay in the host.'
  - 'Additive, no signature removed or changed (as S4c-3 did for color_se): GrepFlags fields color_cn, match_ms, match_off; GrepHost::out_header_no_matcher for the NULL-matcher header of the -o multi-line echo (column number 1 under -k). It crosses the C ABI as bit 1 of the existing out_header newline argument; the facade lambda decodes bit 0 as newline and bit 1 as NULL matcher.'
  - 'S4c-3 port: Rust bodies of branch::setup, quiet_list, count and format in rust/src_core/src/search.rs. The C++ bodies of Grep::search_setup, search_quiet_list, search_count and search_format in src/ugrep.cpp are forwarders to the bridge (search_setup(ctx), search_quiet_list/count/format(ctx, matcher) -> u8 SearchStep). No build switch, no tap. Shell Grep::search and compute_cost stay in C++ until the last S4c child.'
  - 'Additive GrepFlags field color_se (signature change request, as S4c-2b did for color_sl): count uses it for -c --color. Filled in ffi/search_host.rs flags_from_settings.'
  - 'Forwarders bind ctx.pathname into the facade path_slot (RAII, unbound on return) so out_header_file/out_format and the format handlers see the pathname; before this nothing bound it.'
  - 'No per-line bridge allocation: Rust reads flags once, counters live in locals and are written back on every exit; the facade out_format and out_format_count callbacks pass the global --format/--format-open/--format-close text without a std::string copy (known_format).'
