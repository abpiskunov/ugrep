notes:
  - 'D-zstream-unit: ported together with zstream_core in one task; both records list all zs_* functions. Codecs live in zstream_codecs.rs (decoders, zip/7z parsing) over ffi/codecs.rs (extern C zlib/bz2/lzma/lz4/zstd/viiz).'
  - 'Intentional deviations: store-branch copy clamped to buf len (C++ overflows); Lz4 compact guards zloc > zlen (C++ wraps); zip crc32 skipped for num <= 0; stale zbuf bytes read as zeros; decoders call inflateEnd/BZ2_bzDecompressEnd/lzma_end on drop (C++ leaks). Brotli and bz3 are always unsupported in Rust (not built in the reference).'
  - 'unit gate: GATE unit zstream_core: PASS (migration/out/gates/unit/zstream_core/report.json); seam-replay divergent_cases=0 over 33 zs_* cases; rust-tests 6 passed; policy-scan --plan clean. ~120 min. rust/src_leaves/build.rs links the retained codec libs from ..\codec-build\lib (static, bundled) so the umbrella and tests resolve them; ugrep_rust_zs_initial hands the sniffed plain-file prefix to the C++ adapter.'
