notes:
  - 'S4c-2a Prepare seam: C++ bodies unchanged and active, default build C++, Rust entry points are panic stubs (grep_search::file::*), facade Grep::SeamFacade in src/ugrep.cpp is not instantiated yet. Details: rust/src_core/SEAM.md "Grep file members".'
  - 'C++ signatures (struct Grep): bool cnf_matching(const char *bol, const char *eol, bool acquire = false); bool cnf_satisfied(bool acquire = false); bool open_file(const char *pathname, const char *find = NULL); bool filter(FILE *&in, const char *pathname); bool close_file(const char *pathname); bool init_read(); bool init_is_binary(); void output_or_save_restline(bool invert = false, bool hex_context = false); void output_restline(bool invert = false, bool hex_context = false); void save_restline().'
  - 'Bridge (lib.rs): search_cnf_matching(ctx, matcher, bol, eol, acquire) -> u8 and search_cnf_satisfied(ctx, acquire) -> u8 (0 no, 1 yes, 2 EXIT; 2 also when the exception channel has a pending error); search_open_file(ctx, pathname, find, has_find, is_stdin) -> bool; search_filter(ctx, pathname), search_close_file(ctx, pathname) -> bool; search_init_read(state: &GrepState, ctx, matcher) -> bool; search_init_is_binary(ctx, matcher) -> bool; search_output_or_save_restline(ctx, matcher, invert, hex_context), search_output_restline(same), search_save_restline(ctx) -> (). GrepState (grep_state_new) is the Grep-lifetime Rust state for the mmap mapping, created and dropped with the Grep by the facade owner.'
  - 'Exception channel: no exception unwinds through a Rust frame. Every facade lambda (env and matcher table) runs under catch (...) into a std::exception_ptr and returns a neutral value; error_pending tells Rust, which returns EXIT; the C++ caller of the bridge calls rethrow(). EXIT_SEARCH (cnf_matching/cnf_satisfied, caught in Grep::search) is the protocol exception: the facade returns code 2 (UGREP_CORE_CNF_EXIT == STEP_EXIT); the C++ members still throw it.'
  - 'Env callbacks added (66 words in total, 16 of them for the review: error_pending, restline_set, input_encoding, encoding_null_data, flag_filter, flag_filter_magic_label, file_open, file_close, file_read_error, file_set_binary, file_nonblock_regular, file_probe_interactive, file_seek_set, stdin_drain_check, filter_spawn, is_binary), earlier: filename, interactive get/set, file_in get/set, input file/set/clear/get, source, stdin_file, filter_magic_scan, warning, zthread_start/open_next/cancel, cnf_alts, cnf_alt_matcher, cnf_bit_get/set. No mmap callback: mmap is ported to Rust (operator answer).'
  - 'zthread slots are never NULL: Grep::zthread forwarders under HAVE_LIBZ, stubs (NULL / no-op) otherwise, e.g. Base-Release; the Rust mirror reads them as Option<fn>.'
  - 'Matcher table (39 words): input, buffer, buffer_all, avail, begin_ptr(ctx, len) (NULL unless len bytes lie inside the data), set_input_handler (bin/stdin), find_in_line(ctx, src_ctx, bol, eol) (buffer + find in one call, replaces buffer_line); begin stays an offset. Facade fills it for RE-flex Matcher, PCRE2 (HAVE_PCRE2), Boost (HAVE_BOOST_REGEX), LineMatcher and FuzzyMatcher.'
  - 'Soundness: BufferPtr/FileRef/OwnedFile/InputHandle/GrepState live in ffi/matcher_raw.rs with private fields (port modules cannot forge them); FileRef is a borrowed never-NULL FILE* (getters file_in/input_file/source/stdin_file; by-reference calls only); OwnedFile (file_open, filter_spawn, zthread_start/open_next) is non-Copy, never NULL (Option), the only type file_close accepts; FileSource {Owned, Stdin, Source} is what set_file_in/filter_spawn take; the facade NULL-checks every FILE* callback (std::out_of_range on the channel); BufferPtr not Copy; GrepState.mapping private, set by unsafe raw::set_mapping; SeamFacade owns rust::Box<GrepState>; the branch bridges return EXIT and the bool file bridges false on a pending error; matchers_matcher uses the cnf_alt_matcher handle cache; ADD_BEFORE_CONTEXT_MATCH is bounds-checked; copy_begin is unsafe; the facade bounds-checks every offset and index Rust passes (std::out_of_range on the channel). restline SAVED carries an offset; restline_set is the primitive of save_restline. Grep::filter is split: filter_spawn holds the pipe/fork code unchanged.'
  - 'Walked bodies: cnf_matching tests lines of Grep::matcher with other matchers (find_in_line); open_file needs is_stdin, fopenw_s warning, _setmode, Linux O_NONBLOCK, interactive probe; filter needs flag_filter, flag_filter_magic_label, fseek, magic scan, filter_spawn; close_file needs ferror+warning, fclose(input.file()), stdin drain, out.eof, zthread; init_read needs input_encoding, encoding_null_data, buffer_all, handlers; init_is_binary needs is_binary. WITH_DECOMPRESSION_THREAD and WITH_NO_MMAP are always defined, so the zstream branch is dead.'
  - 'Verified in the Prepare seam: Base-Release compiles and links; Pcre-Release (HAVE_PCRE2, HAVE_LIBZ) builds and links with the sibling codec folders (operator review; the Integrating sandbox has no codec sources). HAVE_BOOST_REGEX is in no build configuration: that branch is unverified by compilation. Open for S4c-2b: lifetime of Grep::file_in/input once open_file is switched.'
  - 'Review 4: FileSource gained Source (Static::source, never closed); set_file_in takes &mut self (overwrites without closing); input_set_file(&mut self, FileSource, encoding) hands the stream to the host, input_set_file_in(&mut self, encoding) uses Grep::file_in; copy_bytes takes &MatcherHandle.'
  - 'Review 5: SearchContext::with_host_mut reaches the &mut host methods. take_file_in is removed; host primitives close_input_file and close_file_in (env slots 66, 67; env is 68 words) cancel a blocked zthread (flag_decompress && out.eof), fclose unless stdin/Static::source, clear input and detach facade matchers that read the stream; the stream is never handed to Rust. zthread_start takes no file (uses Grep::file_in; ABI change: the file argument is gone). close_file port sequence is in SEAM.md.'
