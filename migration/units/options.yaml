schema: cpp-rust-unit/1
unit: options
component: src_core
functions: [src_core.options, src_core.option_regexp, src_core.option_and, src_core.option_andnot, src_core.option_not, src_core.option_all_files, src_core.set_depth, src_core.set_depth_long, src_core.getoptarg, src_core.getloptarg, src_core.strarg, src_core.strtonum, src_core.strtopos, src_core.strtopos2, src_core.strtosize, src_core.strtofuzzy]
cpp_files: [src/ugrep.cpp]
