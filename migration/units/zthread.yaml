notes:
  - 'Port: ZthreadCpp, its facade branch and the CPP_RUST_IMPL_ZTHREAD switch are deleted; src/zthread.hpp deleted (Q-zthread-header). struct Zthread in src/ugrep.cpp is now only the callback adapter (D-zthread-adapter; the returned FILE* is made by Rust, env callbacks incl. select_by_flags for hidden/--include/--exclude/-M). The thread, pipes, handshake, tar/cpio/zip filters and the --zmax chain are in rust/src_core/src/zthread_core.rs (no unsafe); all unsafe is in ffi/zthread_sys.rs. Signature changes: D-zthread-signature; races fixed: D-zthread-races.'
  - 'Gate: GATE unit-cleaned zthread: PASS (migration/out/gates/unit-cleaned/zthread/report.json), 224 cases, 0 divergent, 85 rust tests.'
  - 'Placement: Rust Zthread lives in src_core, which depends on src_leaves (default-features=false) for the zstream core; acyclic. See D-zthread-placement.'
  - 'Unknown ownership (resolved in the Port): when start() fails Rust closes its own pipe fds and the C++ caller still fcloses file_in; a pipe read end returned by open_next/start is an open FILE* (fdopen done in Rust) owned by the caller (fclose).'
  - 'Seam notes: rust/src_core/SEAM.md, section "ugrep.cpp Zthread seam". No seam gate in the plan; baseline src_core PASS (5034 surface cases, 0 divergent).'
  - 'Behavior (this task): 224 surface cases (zt-*: gzip/bzip2/xz/zip/tar/cpio/7z/lz4, --zmax and --depth, cancel, corrupt) in migration/corpus/src_core_codec/cases.jsonl (generator migration/harness/src_core_codec/gen_cases.py, 7z and lz4 bytes in fixtures.json), recorded 5x each on msvc/bin/Pcre-Release-x64/ugrep.exe (D-src_core-codec; build: migration/harness/zstream/fetch-codecs.ps1, then migration/harness/build-cpp.ps1 -Configuration Pcre-Release) into migration/corpus/src_core_codec/surface/cases.trace.jsonl; 0 flaky, C++ against itself 0 divergent, no masks needed (migration/masks/src_core_codec.json from master is unchanged). Catalog migration/behavior/src_core_codec.yaml (B-src_core_codec-001..039, 028 deleted): 38 entries; 2 hypothesis for Triage, 7 bug-preserve under the src_leaves zstream decisions. Covers --zmax 1/2/3, zip/tar/cpio/7z/lz4/tgz/tbz/txz/tzst, multi-member archives, -m/-l/-q cancellation (single stream, archives, zmax chains, many files) and corrupt/unreadable inputs. Gate: gate-check --gate behavior-ready --target src_core_codec. The src_core corpus and catalog are untouched.'
  - 'Re-record only the zt-* subset in src_core_codec (never src_core): python migration/harness/src_core_codec/gen_cases.py, then cpp2rust-tools run-cases --bin msvc/bin/Pcre-Release-x64/ugrep.exe --impl cpp --repeat 5 --cases migration/corpus/src_core_codec/cases.jsonl --env-matrix migration/env-matrix.json --timeout 60 --out migration/corpus/src_core_codec/surface/cases.trace.jsonl.'
  - 'Not expressible by run-cases: binary stdin (a gzip on stdin is decompressed by the C++, probed by hand). Seam-level traces (start/open_next/cancel/close) are not recordable: src_core is cleaned and has no tap.'
