    evidence: ["case:corrupt-tar-truncated", "case:corrupt-tar-bad-checksum", "case:cpio-truncated"]
    origin: capture
  - id: B-zthread-106
    statement: "--heading with an archive prints the member lines as '{MEMBER}:LINE:text' with no heading line and without the archive name"
    kind: edge-case
    status: hypothesis
    suspicious: true
    why: "the archive name is lost in --heading output; other options print ARCHIVE{MEMBER}"
    evidence: ["case:zip-heading"]
    origin: capture
  - id: B-zthread-107
    statement: "Under --zmax=2 a corrupt gzip member inside a zip/tar is output with half-decoded text ('alpha foo') and no warning; with a truncated inner gzip as the top-level stream, the decoded part is output with no warning"
    kind: error
    status: hypothesis
    suspicious: true
    why: "the same silent-truncation behavior as B-zthread-101, one level down the chain"
    evidence: ["case:corrupt-zmax2-zip-inner-gz", "case:corrupt-zmax2-tar-inner-gz", "case:corrupt-zmax2-inner-gz"]
    origin: capture

