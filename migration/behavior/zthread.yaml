  - id: B-zthread-101
    statement: "A truncated gzip prints the lines decoded so far and exits 0, with no warning (also a truncated big gzip: count of the decoded part)"
    kind: error
    status: hypothesis
    suspicious: true
    why: "silent data loss: unlike a bad CRC, a truncated gzip is not reported; the user cannot tell a short result from a complete one"
    evidence: ["case:corrupt-gz-truncated", "case:corrupt-gz-big-truncated"]
    origin: capture
  - id: B-zthread-102
    statement: "A truncated bzip2, xz or tgz stream yields no output, no warning and exit 1 (the same exit as 'no match')"
    kind: error
    status: hypothesis
    suspicious: true
    why: "silent: indistinguishable from no match; gzip, zip and corrupt-content cases do warn"
    evidence: ["case:corrupt-bz2-truncated", "case:corrupt-xz-truncated", "case:corrupt-tgz-truncated"]
    origin: capture
  - id: B-zthread-103
    statement: "A zip member whose compressed bytes are damaged is output with wrong text and no warning (the zip member CRC-32 is not checked because WITH_ZIP_CRC32 is not defined)"
    kind: error
    status: hypothesis
    suspicious: true
    why: "wrong data is searched and reported without any error"
    evidence: ["case:corrupt-zip-bad-member-data"]
    origin: capture
  - id: B-zthread-104
    statement: "A zip with LZMA-compressed members (method 14, made by Python zipfile) is rejected with 'a lzma decompression error was detected in the zip compressed data'"
    kind: error
    status: hypothesis
    suspicious: true
    why: "a valid zip method is reported as an error; unclear whether the C++ is wrong or the writer's header is unsupported"
