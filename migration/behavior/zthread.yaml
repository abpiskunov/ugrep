# Behavior catalog of unit zthread (struct Zthread of src/ugrep.cpp: decompression thread, pipe, zmax chain, cancel).
# Every entry was observed by running the C++ reference (msvc/bin/CodecRef-x64/ugrep.exe, built by
# migration/harness/zstream/build-codec-ref.ps1 from the pre-Cleanup sources with all codecs; the Base-Release
# product has no HAVE_LIBZ, so `-z` is unavailable there). Surface cases: migration/corpus/zthread/cases.jsonl
# (generator migration/harness/zthread/gen_cases.py), recorded 5 times each, 0 flaky, C++ against itself 0 divergent.
# Every case is single-threaded (-J1, --sort=name). The Windows build prints "\r\n" in warnings.
# Entries flagged `suspicious` are not classified: the Triage task asks the user (bug-compatibility ask-per-behavior).
schema: cpp-rust-behavior/1
component: zthread
stop: {quiet_rounds: 2}

observation:
  src_core.zthread_start:
    channels: [stdout, stderr, exit, fs]
    compared: [stdout, stderr, exit, fs]
    excluded: []
  src_core.zthread_open_next:
    channels: [stdout, stderr, exit]
    compared: [stdout, stderr, exit]
    excluded: []
  src_core.zthread_cancel:
    channels: [stdout, stderr, exit]
    compared: [stdout, stderr, exit]
    excluded: []
  src_core.zthread_close:
    channels: [exit]
    compared: [exit]
    excluded: []

behaviors:
  - id: B-zthread-001
    statement: "-z decompresses gzip, bzip2, xz and lzma-alone files and searches the decompressed text; without -z the same file is searched as raw bytes (no match)"
    kind: normal
    status: observed
    evidence: ["case:gz", "case:bz2", "case:xz", "case:lzma-alone", "case:gz-no-z"]
    origin: capture
  - id: B-zthread-002
    statement: "Concatenated gzip, bzip2 and xz members are searched as one stream; gzip header fields (FNAME, FCOMMENT) are skipped"
    kind: edge-case
    status: observed
    evidence: ["case:gz-concatenated", "case:bz2-multistream", "case:xz-multistream", "case:gz-header-fields"]
    origin: capture
  - id: B-zthread-003
    statement: "Large (about 700 KB) streams through the pipe produce the same counts as small ones, for gzip, bzip2, xz, zip, tar and tgz members"
    kind: resource
    status: observed
    evidence: ["case:gz-big", "case:bz2-big", "case:xz-big", "case:zip-big-member", "case:tar-big-member", "case:tgz-big", "case:zip-data-descriptor-big"]
    origin: capture
  - id: B-zthread-004
    statement: "A single compressed file is reported under its own name; an empty stream or a zero-length .gz file yields no output and exit 1"
    kind: edge-case
    status: observed
    evidence: ["case:gz-fname-n", "case:gz-empty-content", "case:gz-zero-length-file"]
    origin: capture
  - id: B-zthread-005
    statement: "A gzip stream whose content is binary prints 'Binary file NAME matches' unless -a; with -a the raw bytes are output"
    kind: edge-case
    status: observed
    evidence: ["case:gz-binary-member", "case:gz-binary-text"]
    origin: capture
  - id: B-zthread-006
    statement: "Archive members are reported as ARCHIVE{MEMBER}; zip (deflate, stored, bzip2, with data descriptors, duplicate names, unicode names), tar (ustar, pax, GNU long names, directories, empty and binary members, symlink entries) and cpio (newc, also gzipped) are extracted one member at a time in archive order"
    kind: normal
    status: observed
    evidence: ["case:zip", "case:zip-stored", "case:zip-bzip2", "case:zip-data-descriptor", "case:zip-duplicate-names", "case:zip-member-names-unicode", "case:tar", "case:tar-pax", "case:tar-gnu-longname", "case:tar-dirs-empty-binary", "case:tar-symlink", "case:cpio", "case:cpio-gz", "case:zip-dirs-empty-binary", "case:zip-many-members"]
    origin: capture
  - id: B-zthread-007
    statement: "tgz, tar.gz, tbz, txz and tzst are decompressed and then split into members in one pass, with only --zmax=1 (the default): a.tgz{x.txt}"
    kind: normal
    status: observed
    evidence: ["case:tgz", "case:tar-gz-ext", "case:tbz", "case:txz", "case:tzst", "case:tgz-big"]
    origin: capture
  - id: B-zthread-008
    statement: "The flags part of select_matching is applied per member: --include/--exclude/-g/-t filter members by name, hidden members (leading dot) are skipped, --no-hidden has no extra effect on them"
    kind: ordering
    status: observed
    evidence: ["case:zip-include", "case:zip-exclude", "case:zip-hidden", "case:zip-no-hidden", "case:tar-include", "case:zip-filter-ext", "case:zip-glob-name", "case:zmax2-include"]
    origin: capture
  - id: B-zthread-009
    statement: "Archive output is per member for -c, -l, -L, -v, -o, -n, -C, --null, --json, --csv and --format (%f is ARCHIVE{MEMBER}); -H/--no-filename does not remove the part name from -c output"
    kind: normal
    status: observed
    evidence: ["case:zip-count", "case:zip-files-with-matches", "case:zip-files-without-match", "case:zip-invert", "case:zip-o", "case:zip-context", "case:zip-l-null", "case:zip-json", "case:zip-csv", "case:zip-format", "case:zip-no-header", "case:zip-tree", "case:tar-count", "case:tar-l"]
    origin: capture
  - id: B-zthread-010
    statement: "Binary members of an archive print 'Binary file ARCHIVE{MEMBER} matches', are skipped by -I, and shown as a hex dump with --hexdump"
    kind: edge-case
    status: observed
    evidence: ["case:zip-binary-matches", "case:zip-binary-files-without-match", "case:zip-hexdump"]
    origin: capture
  - id: B-zthread-011
    statement: "-m NUM applies per archive member and per file, not to the whole archive"
    kind: edge-case
    status: observed
    evidence: ["case:zip-max-count-per-part", "case:gz-max-count-multiple", "case:cancel-m1-zip-big", "case:cancel-m1-tar-big", "case:cancel-m1-many-files"]
    origin: capture
  - id: B-zthread-012
    statement: "Several compressed and archived files in one run, and -r over a directory of them, are searched in file order with the right names"
    kind: ordering
    status: observed
    evidence: ["case:gz-multi-files", "case:gz-recursive", "case:multi-archives", "case:recursive-archives", "case:gz-count-multiple", "case:gz-glob-name"]
    origin: capture
  - id: B-zthread-013
    statement: "--zmax=1 (default) decompresses one level: a gzip of a gzip, or a gzip of text inside a zip/tar, is not decompressed further (no match, or the inner .gz member is reported as binary/not matched)"
    kind: normal
    status: observed
    evidence: ["case:zmax1-gz-gz", "case:zmax1-zip-of-gz", "case:zmax1-tar-of-tar", "case:zmax2-gz-gz-gz-short"]
    origin: capture
  - id: B-zthread-014
    statement: "--zmax=N>1 chains N-1 further decompression threads: nested gzip/bzip2/xz of any codec mix, archives inside archives (zip of zip, tar of tar, zip of tgz, tgz of tgz, zip of cpio) are searched, with the part name ARCHIVE{INNER:MEMBER}; a compressed non-archive member keeps ARCHIVE{MEMBER}"
    kind: normal
    status: observed
    evidence: ["case:zmax2-gz-gz", "case:zmax3-gz-gz-gz", "case:zmax2-gz-bz2", "case:zmax3-xz-gz-bz2", "case:zmax2-zip-of-gz", "case:zmax2-tar-of-gz", "case:zmax2-tar-of-tar", "case:zmax2-zip-of-zip", "case:zmax2-zip-of-tgz", "case:zmax3-zip-of-tgz", "case:zmax2-tgz-of-tgz", "case:zmax3-tgz-of-tgz", "case:zmax2-zip-of-cpio", "case:tzst-zmax2"]
    origin: capture
  - id: B-zthread-015
    statement: "With --zmax>1 -c, -l, --include and big streams give the same totals as without nesting; several top-level files of different nesting depth are handled in one run"
    kind: normal
    status: observed
    evidence: ["case:zmax2-count", "case:zmax2-l", "case:zmax2-big", "case:zmax2-multi"]
    origin: capture
  - id: B-zthread-016
    statement: "--zmax=0 and a non-number are rejected with 'invalid argument --zmax=X' and exit 2; a large value (99) is accepted; -z1 and -z2 are accepted spellings (-z2 on a double gzip exits 1 with no output, -z1 on a single gzip prints with the file name prefix)"
    kind: error
    status: observed
    evidence: ["case:zmax0", "case:zmax-invalid", "case:zmax-large", "case:zmax-option-short", "case:zmax-option-short2"]
    origin: capture
  - id: B-zthread-017
    statement: "Cancellation: -m1 on a large gzip/bzip2/xz stream stops after the first match and the process exits normally (the decompression thread is cancelled mid-stream, no warning, no hang)"
    kind: resource
    status: observed
    evidence: ["case:cancel-m1-gz-big", "case:cancel-m3-gz-big", "case:cancel-m1-bz2-big", "case:cancel-m1-xz-big", "case:cancel-late-match-l"]
    origin: capture
  - id: B-zthread-018
    statement: "Cancellation: -l and -q stop the extraction of the rest of a large archive after the first match, for zip, tar and tgz (-q prints nothing and exits 0 on first match, exit 1 when nothing matches)"
    kind: resource
    status: observed
    evidence: ["case:cancel-l-gz-big", "case:cancel-q-gz-big", "case:cancel-l-zip-big", "case:cancel-q-zip-big", "case:cancel-q-nomatch-zip", "case:cancel-l-tar-big", "case:cancel-q-tar-big", "case:cancel-l-tgz-big", "case:cancel-q-tgz-big"]
    origin: capture
  - id: B-zthread-019
    statement: "Cancellation with --zmax>1 cancels the whole chain of decompression threads (gzip of gzip, zip of tgz, many nested parts), also at -m, -l and -q, without hang, warning or output after the match"
    kind: resource
    status: observed
    evidence: ["case:cancel-l-zmax2-gz-big", "case:cancel-m1-zmax2-gz-big", "case:cancel-q-zmax2-gz-big", "case:cancel-l-zmax2-zip-tgz", "case:cancel-m1-zmax3-zip-tgz", "case:cancel-q-zmax3-zip-tgz", "case:zmax2-cancel-many-parts", "case:zmax2-cancel-q-many-parts", "case:zmax2-m1-many-parts"]
    origin: capture
  - id: B-zthread-020
    statement: "Cancellation between files: the thread of one file is stopped and a new one started for the next file, over 4 to 20 compressed files, recursion and --max-files, with the same output as an uncancelled run restricted to the match"
    kind: ordering
    status: observed
    evidence: ["case:cancel-l-many-files", "case:cancel-m1-many-files", "case:cancel-q-many-files", "case:cancel-recursive-l", "case:cancel-max-files", "case:many-files-cancel-l", "case:many-files-cancel-m1"]
    origin: capture
  - id: B-zthread-021
    statement: "A bad gzip/bzip2/xz data error, a bad zip central directory or a truncated zip is reported as 'ugrep: cannot decompress NAME: MESSAGE' on stderr (with CRLF on Windows), exit 1 for a corrupt single file; for a truncated zip the members read before the error are still output (exit 0)"
