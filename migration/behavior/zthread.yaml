  - id: B-zthread-027
    statement: "A hand-made cpio with a wrong layout is read up to its first entry, whose content is reported as binary; an empty tar (zero blocks) and a lzma-alone tar named .tlzma give exit 1, no output"
    kind: edge-case
    status: observed
    evidence: ["case:cpio-handmade", "case:tar-empty-archive", "case:cpio-truncated", "case:tlzma"]
