# migration/corpus/src_leaves/seam/cases.jsonl (seam, ids gm-*) and cases.jsonl (surface, ids glob-*).
# On Windows PATHSEP is '\\': a pathname separated by '/' never contains a separator, a glob '/' matches '\\'.
# The "-win" cases repeat a case with the pathname written with '\\' (what ugrep passes on Windows).
