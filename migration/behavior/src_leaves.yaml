    kind: error
    status: bug-preserve
    decision: Q-glob-2
    suspicious: true
    why: "invalid UTF-8 is decoded to U+FFFD after consuming a varying number of bytes, so whether '?' matches depends on how the bad bytes happen to split"
    evidence: ["case:gm-invalid-utf8-lone-continuation-in-text", "case:gm-invalid-utf8-truncated-2byte", "case:gm-invalid-utf8-overlong-c0", "case:gm-invalid-utf8-overlong-c1", "case:gm-invalid-utf8-overlong-3byte", "case:gm-invalid-utf8-bad-3byte-cont", "case:gm-invalid-utf8-f0-overlong", "case:gm-invalid-utf8-f4-too-large", "case:gm-invalid-utf8-f5", "case:gm-invalid-utf8-truncated-4byte"]
