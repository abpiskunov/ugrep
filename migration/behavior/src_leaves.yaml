  - id: B-src_leaves-030
    statement: "z_close after writes does not flush: the final code and the pending output buffer are never written, so the file lacks the tail of the compressed stream (zs_mode is never set by z_open, calloc leaves it 0, so the 'w' branch of z_close is dead)"
    kind: error
    status: hypothesis
    suspicious: true
    why: "data written then closed cannot be read back whole: the stream loses its tail (e.g. 300 bytes written read back as 279); a zopen writer is not used by ugrep, so the effect is latent"
